# Render Blueprint: Dashboard → New → Blueprint → select this repo.
# Creates a PostgreSQL database and the API web service, with secrets generated automatically.
databases:
  - name: agriksense-db
    databaseName: agriksense
    user: agriksense
    plan: free
    region: frankfurt

services:
  - type: web
    name: agriksense-api
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/funny-curie-p1cz1v
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations and the idempotent seed run on every start (free instances have no pre-deploy step).
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: agriksense-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: HASH_KEY
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@agriksense.test
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      # Test-friendly providers: deterministic NIN/CAC outcomes, messages written to the logs.
      - key: VERIFICATION_PROVIDER
        value: mock
      - key: NOTIFICATION_PROVIDER
        value: log
      # "mock" returns deterministic detections; set to "http" to call the real model services
      # once their request/response format is confirmed (see README "Before go-live").
      - key: AI_INFERENCE_MODE
        value: mock
      - key: AI_RICE_URL
        value: https://rice-disease-api-vzxa.onrender.com
      - key: AI_MAIZE_URL
        value: https://maize-disease-api.onrender.com
      - key: AI_TOMATO_URL
        value: https://tomato-disease-api-w8if.onrender.com
      - key: NOTIFICATION_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
